services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    user: vscode
    command: sleep infinity
    volumes:
      - ./:/workspaces/itz:cached
      - maven-cache:/home/vscode/.m2
    working_dir: /workspaces/itz
    env_file:
      - .env
    depends_on:
      oracle:
        condition: service_healthy
      eap:
        condition: service_started

volumes:
  maven-cache:
