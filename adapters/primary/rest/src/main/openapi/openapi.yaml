openapi: 3.0.3
info:
  title: ITZ API
  version: 0.1.0
servers:
  - url: /itz/api
    description: Relativer API-Basispfad auf dem jeweiligen Host
security:
  - bearerAuth: []
paths:
  /files:
    post:
      tags:
        - Files
      operationId: uploadFile
      summary: Laedt eine Datei hoch
      description: >-
        Erfordert die Rolle user. Maximal 25 MiB (26214400 Bytes) Dateiinhalt;
        die tatsächliche Größe wird beim Einlesen geprüft. Leere Dateien sind erlaubt.
        Vorgeschaltete Container-/Multipart-Grenzen können Requests bereits vor der
        Anwendungsprüfung abweisen. Im lokalen EAP kann ein übergroßer Request
        deshalb eine HTML-500-Antwort statt der JSON-413-Antwort auslösen.
        Ein erfolgreicher Upload speichert geprüften Inhalt und Metadaten.
        Der lokale Mock-Scanner erkennt nur den EICAR-Testmarker und ersetzt keinen produktiven Virenschutz.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: >-
                    Dateiname und Content-Type muessen gueltiges Unicode enthalten und duerfen nicht leer sein.
                    Maximal 255 Unicode-Codepoints fuer den Dateinamen und 512 fuer den Content-Type einschliesslich Parametern.
                    Content-Type muss ein konkreter Medientyp gemaess RFC 9110 mit syntaktisch gueltigen Parametern sein; Wildcards sind unzulaessig.
                    Dateinamen duerfen weder . noch .. sein und keine Pfadtrenner (/ und Backslash),
                    Sonderzeichen < > : " | ? *, ISO-Steuerzeichen, Unicode-Zeilentrenner U+2028/U+2029
                    oder Bidi-Steuerzeichen U+061C, U+200E/U+200F, U+202A–U+202E, U+2066–U+2069 enthalten.
                    Ohne Dateinamen wird upload.bin verwendet.
                    Der Content-Type ist eine Client-Angabe, keine verifizierte Inhaltserkennung.
      responses:
        "201":
          description: Datei wurde gespeichert
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResponse"
        "400":
          description: Ungueltige Upload-Anfrage (INVALID_UPLOAD)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "413":
          description: Die Anwendungsprüfung erkennt mehr als 25 MiB Dateiinhalt (FILE_TOO_LARGE).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "422":
          description: Datei wurde vom Scanner abgewiesen (FILE_INFECTED)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: >-
            Anwendungsfehler als JSON: Speicherung fehlgeschlagen (UPLOAD_FAILED) oder
            unerwarteter Fehler (REQUEST_FAILED). Fehler vor JAX-RS, etwa beim Einlesen
            übergroßer Multipart-Requests, können von EAP als HTML ohne X-Request-ID zurückkommen.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
  /ping:
    get:
      tags:
        - Ping
      operationId: ping
      summary: Prueft, ob die Anwendung erreichbar ist
      description: Erfordert die Berechtigung PING, die aktuell durch die Rolle special gewährt wird.
      responses:
        "200":
          description: Anwendung ist erreichbar
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          description: Unerwarteter Anwendungsfehler als JSON (REQUEST_FAILED) oder Containerfehler als HTML.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Gültiger Access Token des konfigurierten Keycloak-Realms; Rollen sind keine OAuth-Scopes.
  headers:
    RequestId:
      description: >-
        Korrelations-ID für Antworten der Anwendung. Ein gültiger X-Request-ID-Request-Header
        (1 bis 128 Zeichen aus A-Z, a-z, 0-9, Punkt, Unterstrich, Doppelpunkt und Bindestrich)
        wird übernommen; fehlende oder ungültige Werte werden durch eine UUID ersetzt.
        Containerantworten vor den JAX-RS-Filtern garantieren diesen Header nicht.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
  responses:
    Unauthorized:
      description: >-
        Fehlender, ungültiger oder abgelaufener Bearer-Token. EAP/OIDC antwortet vor
        JAX-RS mit HTML, nicht mit ErrorResponse; X-Request-ID wird hier nicht garantiert.
      headers:
        WWW-Authenticate:
          description: Bearer-Challenge, gegebenenfalls mit Fehlerparametern.
          schema:
            type: string
          example: Bearer
      content:
        text/html:
          schema:
            type: string
    Forbidden:
      description: Authentifiziert, aber die erforderliche Anwendungsberechtigung fehlt (FORBIDDEN).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    FileResponse:
      type: object
      required:
        - id
        - filename
        - contentType
        - size
        - status
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            Originaldateiname mit maximal 255 Unicode-Codepoints; reine Leerzeichen sind unzulaessig.
            Weder . noch ..; keine Pfadtrenner (/ und Backslash), Sonderzeichen < > : " | ? *,
            ISO-Steuerzeichen, Unicode-Zeilentrenner U+2028/U+2029 oder Bidi-Steuerzeichen
            U+061C, U+200E/U+200F, U+202A–U+202E, U+2066–U+2069.
        contentType:
          type: string
          minLength: 1
          maxLength: 512
          description: Deklarierter konkreter Medientyp gemaess RFC 9110 einschliesslich syntaktisch gueltiger Parameter, ohne Wildcards, maximal 512 Unicode-Codepoints. Keine Pruefung der IANA-Registrierung oder des Dateiinhalts.
        size:
          type: integer
          format: int64
          minimum: 0
        status:
          type: string
          enum: [STORED]
    PingResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: pong
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: FORBIDDEN
        message:
          type: string
          example: The current user is not allowed to perform this operation
