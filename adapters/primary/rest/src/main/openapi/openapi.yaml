openapi: 3.0.3
info:
  title: ITZ API
  version: 0.1.0
paths:
  /ping:
    get:
      tags:
        - Ping
      operationId: ping
      summary: Prueft, ob die Anwendung erreichbar ist
      responses:
        "200":
          description: Anwendung ist erreichbar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"
        "401":
          description: Authentifizierung ist erforderlich
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Berechtigung zum Ausfuehren der Operation fehlt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    PingResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: pong
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: FORBIDDEN
        message:
          type: string
          example: The current user is not allowed to perform this operation
