openapi: 3.0.3
info:
  title: ITZ API
  version: 0.1.0
paths:
  /ping:
    get:
      tags:
        - Ping
      operationId: ping
      summary: Prueft, ob die Anwendung erreichbar ist
      responses:
        "200":
          description: Anwendung ist erreichbar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"
components:
  schemas:
    PingResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: pong
