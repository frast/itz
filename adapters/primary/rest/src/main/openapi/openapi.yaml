openapi: 3.0.3
info:
  title: ITZ API
  version: 0.1.0
servers:
  - url: /itz/api
    description: Relativer API-Basispfad auf dem jeweiligen Host
security:
  - bearerAuth: []
paths:
  /files:
    post:
      tags:
        - Files
      operationId: uploadFile
      summary: Laedt eine Datei hoch
      description: >-
        Erfordert die Rolle user. Maximal 25 MiB (26214400 Bytes) Dateiinhalt;
        die tatsächliche Größe wird beim Einlesen geprüft. Leere Dateien sind erlaubt.
        Der gesamte Multipart-Request ist auf 27 MiB begrenzt, damit Dateimetadaten
        und Multipart-Rahmen berücksichtigt werden. EAP begrenzt den HTTP-Listener
        zusätzlich auf 32 MiB.
        Ein erfolgreicher Upload speichert geprüften Inhalt und Metadaten.
        Der lokale Mock-Scanner erkennt nur den EICAR-Testmarker und ersetzt keinen produktiven Virenschutz.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: >-
                    Dateiname und Content-Type muessen gueltiges Unicode enthalten und duerfen nicht leer sein.
                    Maximal 255 Unicode-Codepoints fuer den Dateinamen und 512 fuer den Content-Type einschliesslich Parametern.
                    Content-Type muss ein konkreter Medientyp gemaess RFC 9110 mit syntaktisch gueltigen Parametern sein; Wildcards sind unzulaessig.
                    Dateinamen duerfen weder . noch .. sein und keine Pfadtrenner (/ und Backslash),
                    Sonderzeichen < > : " | ? *, ISO-Steuerzeichen, Unicode-Zeilentrenner U+2028/U+2029
                    oder Bidi-Steuerzeichen U+061C, U+200E/U+200F, U+202A–U+202E, U+2066–U+2069 enthalten.
                    Ohne Dateinamen wird upload.bin verwendet.
                    Der Content-Type ist eine Client-Angabe, keine verifizierte Inhaltserkennung.
      responses:
        "201":
          description: Datei wurde gespeichert
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResponse"
        "400":
          description: >-
            Ungueltige Anfrage (BAD_REQUEST), Upload (INVALID_UPLOAD),
            Dateiname (INVALID_FILE_NAME) oder Content-Type (INVALID_CONTENT_TYPE).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "406":
          $ref: '#/components/responses/NotAcceptable'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "413":
          description: >-
            FILE_TOO_LARGE wenn der Dateiinhalt 25 MiB überschreitet;
            PAYLOAD_TOO_LARGE wenn der gesamte Multipart-Request 27 MiB überschreitet.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "422":
          description: Datei wurde vom Scanner abgewiesen (FILE_INFECTED)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: >-
            Speicherung fehlgeschlagen (UPLOAD_FAILED) oder unerwarteter Fehler
            (REQUEST_FAILED); die Nachricht enthält keine internen Fehlerdetails.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /ping:
    get:
      tags:
        - Ping
      operationId: ping
      summary: Prueft, ob die Anwendung erreichbar ist
      description: Erfordert die Berechtigung PING, die aktuell durch die Rolle special gewährt wird.
      responses:
        "200":
          description: Anwendung ist erreichbar
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "405":
          $ref: '#/components/responses/MethodNotAllowed'
        "406":
          $ref: '#/components/responses/NotAcceptable'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "500":
          description: Unerwarteter Fehler (REQUEST_FAILED), ohne interne Fehlerdetails.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Gültiger Access Token des konfigurierten Keycloak-Realms; Rollen sind keine OAuth-Scopes.
  headers:
    RequestId:
      description: >-
        Korrelations-ID für Antworten der Anwendung. Ein gültiger X-Request-ID-Request-Header
        (1 bis 128 Zeichen aus A-Z, a-z, 0-9, Punkt, Unterstrich, Doppelpunkt und Bindestrich)
        wird übernommen; fehlende oder ungültige Werte werden durch eine UUID ersetzt.
        Fehlerantworten innerhalb der Webanwendung enthalten diese Korrelations-ID.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
  responses:
    Unauthorized:
      description: Fehlender, ungültiger oder abgelaufener Bearer-Token.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        WWW-Authenticate:
          description: Generische Bearer-Challenge ohne Authentifizierungsdetails.
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authentifiziert, aber die erforderliche Anwendungsberechtigung fehlt (FORBIDDEN).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Die angeforderte Ressource wurde nicht gefunden (NOT_FOUND).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: Die HTTP-Methode ist nicht erlaubt (METHOD_NOT_ALLOWED).
      headers:
        Allow:
          description: Für diese Ressource erlaubte HTTP-Methoden.
          schema:
            type: string
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotAcceptable:
      description: >-
        Das angeforderte Antwortformat wird nicht unterstützt (NOT_ACCEPTABLE).
        Fehler werden stets als JSON ausgegeben.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Der Content-Type der Anfrage wird nicht unterstützt (UNSUPPORTED_MEDIA_TYPE).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    FileResponse:
      type: object
      required:
        - id
        - filename
        - contentType
        - size
        - status
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            Originaldateiname mit maximal 255 Unicode-Codepoints; reine Leerzeichen sind unzulaessig.
            Weder . noch ..; keine Pfadtrenner (/ und Backslash), Sonderzeichen < > : " | ? *,
            ISO-Steuerzeichen, Unicode-Zeilentrenner U+2028/U+2029 oder Bidi-Steuerzeichen
            U+061C, U+200E/U+200F, U+202A–U+202E, U+2066–U+2069.
        contentType:
          type: string
          minLength: 1
          maxLength: 512
          description: Deklarierter konkreter Medientyp gemaess RFC 9110 einschliesslich syntaktisch gueltiger Parameter, ohne Wildcards, maximal 512 Unicode-Codepoints. Keine Pruefung der IANA-Registrierung oder des Dateiinhalts.
        size:
          type: integer
          format: int64
          minimum: 0
        status:
          type: string
          enum: [STORED]
    PingResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: pong
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: FORBIDDEN
        message:
          type: string
          example: The current user is not allowed to perform this operation
