name: itz

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_LOG_CONSOLE_OUTPUT: json
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./config/keycloak:/opt/keycloak/data/import:ro

  oracle-diagnostics-init:
    image: oracle/database:19.3.0-ee
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown oracle:oinstall /diagnostics"]
    volumes:
      - oracle-diagnostics:/diagnostics

  oracle:
    image: oracle/database:19.3.0-ee
    environment:
      ORACLE_SID: ORCLCDB
      ORACLE_PDB: ORCLPDB1
      ORACLE_PWD: ${ORACLE_PWD:?Set ORACLE_PWD in .env}
      ORACLE_CHARACTERSET: AL32UTF8
      ORACLE_EDITION: enterprise
      ITZ_DB_USER: ${ITZ_DB_USER:?Set ITZ_DB_USER in .env}
      ITZ_DB_PASSWORD: ${ITZ_DB_PASSWORD:?Set ITZ_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - oracle-diagnostics:/opt/oracle/diag
      - ./db/setup:/opt/oracle/scripts/setup:ro
    depends_on:
      oracle-diagnostics-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM dual;' | sqlplus -s system/$$ORACLE_PWD@//localhost:1521/ORCLPDB1 | grep -q 1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 4m

  eap:
    build:
      context: ./bundle/eap
      args:
        EAP_BUILDER_IMAGE: ${EAP_BUILDER_IMAGE:-registry.redhat.io/jboss-eap-8/eap81-openjdk21-builder-openshift-rhel9@sha256:ed4244965392a4db27fa869f02cb629ffe5c32eb11c2dba191c16415ef9820dd}
        EAP_RUNTIME_IMAGE: ${EAP_RUNTIME_IMAGE:-registry.redhat.io/jboss-eap-8/eap81-openjdk21-runtime-openshift-rhel9@sha256:2c6c82f312125c937d9ffe2b98a5efb144b4e436a4e7fbd4b6f119857493c6f3}
    environment:
      ORACLE_HOST: oracle
      ORACLE_PORT: "1521"
      ORACLE_SERVICE: ORCLPDB1
      ORACLE_USER: ${ITZ_DB_USER:?Set ITZ_DB_USER in .env}
      ORACLE_PASSWORD: ${ITZ_DB_PASSWORD:?Set ITZ_DB_PASSWORD in .env}
      EAP_MGMT_USER: ${EAP_MGMT_USER:?Set EAP_MGMT_USER in .env}
      EAP_MGMT_PASSWORD: ${EAP_MGMT_PASSWORD:?Set EAP_MGMT_PASSWORD in .env}
    depends_on:
      keycloak:
        condition: service_started
      oracle:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "127.0.0.1:9990:9990"
    healthcheck:
      # /management returns 401 without credentials; that still proves that
      # the management interface is accepting requests.
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://localhost:9990/management"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  loki:
    image: grafana/loki:3.7.2
    profiles: [observability]
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./config/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.16.3
    profiles: [observability]
    user: "0:0"
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-itz}
    volumes:
      - ./config/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
      - oracle-diagnostics:/var/log/oracle:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./config/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  oracle-data:
  oracle-diagnostics:
  keycloak-data:
  loki-data:
  alloy-data:
  grafana-data:
